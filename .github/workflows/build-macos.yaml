name: Build and Release on MacOS

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build-macos:
    if: "!contains(github.head_ref, 'release-please--')"
    runs-on: macos-latest
    env:
      GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build
        run: cargo build --locked
      - name: Unit tests
        run: cargo test --locked --no-fail-fast
      - name: Set up ORAS
        if: env.GHCR_PASSWORD != ''
        uses: oras-project/setup-oras@v1
      - name: Set up pnpm
        if: env.GHCR_PASSWORD != ''
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Pull zcashd package
        if: env.GHCR_PASSWORD != ''
        run: |
          printf '%s' "$GHCR_PASSWORD" | oras login ghcr.io -u hhanh00 --password-stdin
          oras pull ghcr.io/hhanh00/zcashd:6.3.0
          tar xvzf zcashd.tar.gz
          echo "$PWD/zcashd" >> $GITHUB_PATH
      - name: Setup regtest
        if: env.GHCR_PASSWORD != ''
        run: |
          pushd zcashd
          mkdir regtest
          cp zcash.conf regtest/
          $GITHUB_WORKSPACE/docs/setup-regtest.sh
          lightwalletd --no-tls-very-insecure --zcash-conf-path regtest/zcash.conf --data-dir regtest --grpc-bind-addr 0.0.0.0:9067 --log-file /dev/stdout &
          popd
      - name: Run
        if: env.GHCR_PASSWORD != ''
        env:
          RUST_LOG: info
        run: |
          cp sample.env .env
          ./target/debug/zcash-walletd &
      - name: Regtest integration tests
        if: env.GHCR_PASSWORD != ''
        run: |
          pushd test
          pnpm i
          pnpm test
